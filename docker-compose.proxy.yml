# Untuk VPS yang sudah punya nginx-proxy (jaringan Docker "web-network").
# Jalankan dengan (override lokal TIDAK ikut dibaca karena -f eksplisit):
#   docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d --build
# Tidak ada port yang dibuka ke host; nginx-proxy mengakses container "invoice-web".
services:
  web:
    container_name: invoice-web
    networks:
      - default
      - web-network

networks:
  web-network:
    external: true

# Nota Toko Saya — seluruh aplikasi berjalan dengan: docker compose up -d --build
# Semua konfigurasi dibaca dari file .env (salin dari .env.example).
name: nota-toko

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-nota}
      MYSQL_USER: ${DB_USERNAME:-nota}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di file .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Isi DB_ROOT_PASSWORD di file .env}
      TZ: ${APP_TIMEZONE:-Asia/Jakarta}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "Nota Toko Saya"
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_KEY: ${APP_KEY:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-nota}
      DB_USERNAME: ${DB_USERNAME:-nota}
      DB_PASSWORD: ${DB_PASSWORD}
      # Akun pemilik dibuat otomatis saat pertama kali jalan (lihat entrypoint).
      OWNER_NAME: ${OWNER_NAME:-Pemilik Toko}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
    volumes:
      # Logo toko, cadangan, dan APP_KEY otomatis tersimpan di sini.
      - app_storage:/var/www/html/storage

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    # Port tidak dibuka di sini. Lokal: lihat docker-compose.override.yml.
    # VPS di belakang nginx-proxy: lihat docker-compose.proxy.yml.

volumes:
  db_data:
  app_storage:
